run_id: starvla_qwenoft_so101_marker_smoke
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_SO101_Marker
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT          # swap to QwenFAST | QwenPI_v3 | QwenGR00T for the other 3 smoke tests
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
  action_model:
    action_dim: 6          # single_arm(5) + gripper(1), matches data_config.py
    state_dim: 6
    action_horizon: 8       # must equal len(action_indices) in data_config.py

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /home/minsoo/.cache/huggingface/lerobot/mimiminsoo
    data_mix: so101_marker_task
    action_type: abs_qpos
    sequential_step_sampling: false
    per_device_batch_size: 2     # raise once it fits in VRAM
    obs_image_size: [224, 224]
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  # SMOKE TEST FIRST — bump after this passes.
  max_train_steps: 100
  num_warmup_steps: 10
  save_interval: 100
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
